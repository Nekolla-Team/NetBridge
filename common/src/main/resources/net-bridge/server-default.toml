# net-bridge server configuration (generated automatically on first startup; safe to edit directly)

[quic]

# Whether to enable QUIC transport
enable = true

# QUIC listen port: -1 follows the Minecraft TCP port; 0 picks a random port (see startup logs for
# the actual port); 1-65535 uses a fixed port
port = -1

# Address advertised in server-list ping: empty = follow the server address (leave empty when
# clients connect directly to your public IP/domain)
host = ""

# QUIC listen address: empty = follow server.properties server-ip, then fall back to all interfaces;
# An IP literal such as "0.0.0.0" or "::1" restricts the listener to that interface
bind = ""

# Maximum concurrent connections for this transport (excess new connections are silently dropped to
# prevent UDP reflection abuse)
max_connection = 256

[kcp]

# Whether to enable KCP transport (disabled by default; enable as needed)
enable = false

# KCP listen port: -1 = Minecraft TCP port + 1; all other semantics match quic.port
port = -1

# Address advertised in server-list ping: empty = follow the server address
host = ""

# Listen address; semantics are the same as [quic] bind
bind = ""

# Maximum concurrent connections for this transport
max_connection = 256

# Profile: balance (default) / aggressive (trades bandwidth for latency on lossy paths)
profile = "balance"
