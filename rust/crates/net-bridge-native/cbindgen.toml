language = "C"
include_guard = "NETBRIDGE_H"
cpp_compat = true
line_endings = "LF"
style = "type"
documentation = true
documentation_style = "c"
no_includes = true

sys_includes = ["stdint.h", "stddef.h"]

header = """
/*
 * AUTO-GENERATED by `cargo xtask abi-header update`.
 * Source of truth: rust/crates/net-bridge-native/src/abi/.
 * DO NOT EDIT MANUALLY.
 */

#ifdef _WIN32
#define NB_EXPORT __declspec(dllexport)
#else
#define NB_EXPORT __attribute__((visibility("default")))
#endif
#define NB_API NB_EXPORT
"""

[fn]
prefix = "NB_EXPORT"
args = "vertical"

[const]
sort_by = "none"

[export]
exclude = ["API_V1"]
[export.rename]
"NbStatus" = "nb_status_t"
"NbConnection" = "nb_connection_t"
"NbServer" = "nb_server_t"
"NbContext" = "nb_context_t"
"NbBytesViewV1" = "nb_bytes_view_v1_t"
"NbSocketAddressV1" = "nb_socket_address_v1_t"
"NbContextOptionsV1" = "nb_context_options_v1_t"
"NbEventCallbackV1" = "nb_event_callback_v1"
"NbCallbacksV1" = "nb_callbacks_v1_t"
"NbConnectOptionsV1" = "nb_connect_options_v1_t"
"NbServerOptionsV1" = "nb_server_options_v1_t"
"NbApiV1" = "nb_api_v1_t"
