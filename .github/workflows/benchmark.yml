name: benchmark

# On-demand performance suite. Never part of the normal CI gate.
#
# NOTE (B-036): GitHub-hosted runners (ubuntu-latest) are shared, virtualized and
# not a stable performance baseline. Treat every number produced here as indicative
# only; use a dedicated, pinned bare-metal runner for real comparisons.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        default: micro
        options:
          - micro
          - transport
          - all
      profile:
        description: Benchmark profile (quick = short warmup/iterations)
        type: choice
        default: quick
        options:
          - quick
          - normal

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-benchmark
          restore-keys: gradle-${{ runner.os }}-

      - name: Micro benchmarks (JMH)
        if: ${{ inputs.suite == 'micro' || inputs.suite == 'all' }}
        run: |
          if [ "${{ inputs.profile }}" = "quick" ]; then
            ./gradlew :benchmark:jmhQuick --stacktrace
          else
            ./gradlew :benchmark:jmh --stacktrace
          fi

      - name: Transport benchmark
        if: ${{ inputs.suite == 'transport' || inputs.suite == 'all' }}
        run: |
          if [ "${{ inputs.profile }}" = "quick" ]; then
            ./gradlew :benchmark:transportBenchmark -PbenchmarkDuration=3000 -PbenchmarkIterations=3 --stacktrace
          else
            ./gradlew :benchmark:transportBenchmark -PbenchmarkRepetitions=3 --stacktrace
          fi

      - name: Minecraft-shaped workloads
        if: ${{ inputs.suite == 'all' }}
        run: ./gradlew :benchmark:minecraftTraffic -PbenchmarkTransport=tcp --stacktrace

      - name: NativeChannel integration
        if: ${{ inputs.suite == 'all' }}
        run: |
          if [ "${{ inputs.profile }}" = "quick" ]; then
            ./gradlew :benchmark:channelIntegration -PbenchmarkDuration=3000 -PbenchmarkIterations=3 --stacktrace
          else
            ./gradlew :benchmark:channelIntegration --stacktrace
          fi

      - name: Baseline warning
        run: |
          echo "::warning::GitHub-hosted runners are not a performance baseline. Do not compare these numbers across runs or machines."

      - name: Refresh report catalog
        if: always()
        run: ./gradlew :benchmark:benchmarkReport --stacktrace || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark/build/results/
            benchmark/build/reports/benchmarks/
